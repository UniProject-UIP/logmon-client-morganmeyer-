[project]
name = "logmon-client"
version = "0.1.0"
description = "Instrumentación de apps ASGI para enviar operaciones a LogMon"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "anyio>=4.3",
    "fastapi>=0.110",
]
ejemplo = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["logmon_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
